[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brusselator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-learn", "matplotlib", "pandas", "joblib", "mlflow"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]